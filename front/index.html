<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sarthi AI — Autonomous Intelligence Engine</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');

:root{
  --void:#04060B; --void-soft:#080B14; --void-panel:#0B0F1A; --void-raised:#101526;
  --signal:#2F6FFF; --signal-dim:#1C3E8C; --signal-glow:#5C8FFF;
  --sarthi:#7C5CFF; --sarthi-dim:#4B3A99; --sarthi-glow:#A78BFF;
  --verdant:#2DD4A7; --verdant-dim:#1A8066;
  --amber:#FFB020;
  --ink:#E9ECF6; --ink-muted:#9199B5; --ink-faint:#5B6280;
  --border:rgba(255,255,255,0.08);
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  background:var(--void); color:var(--ink);
  font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
.disp{font-family:'Space Grotesk',sans-serif;}
.mono{font-family:'JetBrains Mono',monospace;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--signal-dim);border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}

a,button{font-family:inherit; cursor:pointer;}
button{border:none;background:none;color:inherit;}

.glass{
  background:linear-gradient(180deg, rgba(255,255,255,0.045), rgba(255,255,255,0.015));
  backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
  border:1px solid var(--border); border-radius:18px;
}
.glass-strong{
  background:linear-gradient(180deg, rgba(16,21,38,0.9), rgba(11,15,26,0.85));
  backdrop-filter:blur(24px); border:1px solid rgba(255,255,255,0.09); border-radius:18px;
}
.text-gradient{
  background:linear-gradient(90deg,#E9ECF6 0%, #A9B4E8 50%, #7C5CFF 100%);
  -webkit-background-clip:text; background-clip:text; color:transparent;
}

/* ---------- NAV ---------- */
header{
  position:sticky; top:0; z-index:40; border-bottom:1px solid var(--border);
  background:rgba(4,6,11,0.7); backdrop-filter:blur(18px);
}
.nav-wrap{
  max-width:1400px; margin:0 auto; padding:12px 40px;
  display:flex; align-items:center; justify-content:space-between; gap:16px;
}
.logo-btn{display:flex;align-items:center;gap:10px;background:none;border:none;}
.logo-text{font-size:15px;font-weight:600;letter-spacing:-0.01em;}
.logo-sub{font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:var(--ink-faint);margin-top:1px;}
.nav-pills{display:flex;gap:2px;border:1px solid var(--border);background:rgba(255,255,255,0.02);padding:4px;border-radius:999px;}
.nav-pill{padding:7px 16px;border-radius:999px;font-size:13px;font-weight:500;color:var(--ink-muted);transition:.2s;}
.nav-pill.active{background:rgba(255,255,255,0.08);color:var(--ink);box-shadow:inset 0 0 0 1px rgba(255,255,255,0.08);}
.nav-pill:hover{color:var(--ink);}
.status-chip{display:flex;align-items:center;gap:6px;border:1px solid rgba(45,212,167,0.25);background:rgba(45,212,167,0.07);padding:5px 12px;border-radius:999px;font-size:11px;font-weight:500;color:var(--verdant);}
.dot{width:6px;height:6px;border-radius:999px;background:currentColor;animation:pulseSlow 2.5s ease-in-out infinite;}
@keyframes pulseSlow{0%,100%{opacity:.35}50%{opacity:1}}
@media (max-width:900px){.nav-pills,.status-chip{display:none;}}

main{max-width:1400px; margin:0 auto; animation:fadeIn .4s ease both;}
@keyframes fadeIn{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}

/* ---------- HERO ---------- */
.hero{position:relative; overflow:hidden; border-bottom:1px solid var(--border);}
.hero-canvas-wrap{position:absolute; inset:0; opacity:.7;}
.hero-fade{position:absolute; inset:0; background:linear-gradient(to bottom, transparent, rgba(4,6,11,0.5) 60%, var(--void)); pointer-events:none;}
.hero-inner{position:relative; padding:130px 40px 150px; max-width:760px;}
.eyebrow{display:inline-flex; align-items:center; gap:8px; border:1px solid rgba(124,92,255,0.25); background:rgba(124,92,255,0.06); padding:6px 14px; border-radius:999px; font-size:12px; font-weight:500; color:var(--sarthi-glow); margin-bottom:24px;}
h1.hero-h1{font-size:56px; line-height:1.08; letter-spacing:-0.02em; font-weight:600;}
.hero-p{margin-top:22px; max-width:520px; font-size:17px; line-height:1.6; color:var(--ink-muted);}
.hero-actions{margin-top:34px; display:flex; flex-wrap:wrap; gap:12px;}
.btn-primary{display:inline-flex; align-items:center; gap:8px; background:var(--signal); color:#fff; padding:13px 22px; border-radius:10px; font-size:14px; font-weight:500; box-shadow:0 0 40px -8px rgba(47,111,255,0.45); transition:.2s;}
.btn-primary:hover{transform:translateY(-2px);}
.btn-secondary{display:inline-flex; align-items:center; gap:8px; border:1px solid rgba(255,255,255,0.1); background:rgba(255,255,255,0.03); padding:13px 22px; border-radius:10px; font-size:14px; font-weight:500; transition:.2s;}
.btn-secondary:hover{background:rgba(255,255,255,0.06);}

/* ---------- SECTIONS / GRIDS ---------- */
.section{padding:56px 40px;}
.stat-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:16px;}
@media(max-width:900px){.stat-grid{grid-template-columns:repeat(2,1fr);}}
.stat-card{padding:20px;}
.stat-top{display:flex; align-items:center; justify-content:space-between;}
.icon-chip{background:rgba(255,255,255,0.04); padding:8px; border-radius:10px; color:var(--signal-glow); display:flex;}
.stat-value{font-size:24px; font-weight:600; margin-top:16px;}
.stat-label{font-size:13px; color:var(--ink-muted); margin-top:4px;}

.two-col{display:grid; grid-template-columns:2fr 1fr; gap:24px; margin-top:40px;}
@media(max-width:900px){.two-col{grid-template-columns:1fr;}}
.panel-title{display:flex; align-items:center; justify-content:space-between; margin-bottom:18px;}
.panel-title h3{font-size:16px; font-weight:600;}
.link-btn{font-size:12px; font-weight:500; color:var(--signal-glow);}
.run-row{display:flex; align-items:center; justify-content:space-between; gap:16px; padding:14px 12px; border-radius:12px; transition:.15s; width:100%; text-align:left;}
.run-row:hover{background:rgba(255,255,255,0.03);}
.run-q{font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.run-t{font-size:11px; color:var(--ink-faint); margin-top:2px;}
.bar-track{width:64px; height:6px; border-radius:99px; background:rgba(255,255,255,0.06); overflow:hidden;}
.bar-fill{height:100%; background:linear-gradient(90deg,var(--signal),var(--sarthi));}
.throughput-row{margin-bottom:16px;}
.tr-top{display:flex; justify-content:space-between; font-size:12px; margin-bottom:6px; color:var(--ink-muted);}
.tr-track{height:6px; border-radius:99px; background:rgba(255,255,255,0.06); overflow:hidden;}
.tr-fill{height:100%; border-radius:99px; background:linear-gradient(90deg,var(--verdant),var(--signal)); width:0; transition:width 1s ease;}

/* ---------- QUERY PAGE ---------- */
.query-wrap{max-width:880px; margin:0 auto; padding:64px 40px;}
.query-head{text-align:center; margin-bottom:40px;}
.query-head h1{font-size:34px; font-weight:600; letter-spacing:-0.01em;}
.query-head p{margin-top:12px; color:var(--ink-muted); font-size:15px; max-width:520px; margin-left:auto; margin-right:auto;}
.query-box{padding:8px; box-shadow:0 0 40px -8px rgba(124,92,255,0.45); display:flex; align-items:center; gap:8px;}
.query-box textarea{flex:1; background:transparent; border:none; resize:none; color:var(--ink); font-size:15px; padding:14px 16px; min-height:52px; font-family:inherit;}
.query-box textarea:focus{outline:none;}
.query-box textarea::placeholder{color:var(--ink-faint);}
.btn-analyze{display:flex; align-items:center; gap:8px; background:var(--signal); color:#fff; padding:11px 18px; border-radius:10px; font-size:13px; font-weight:500; margin-right:6px; white-space:nowrap;}
.btn-analyze:disabled{opacity:.4;}
.examples{margin-top:18px; display:flex; flex-wrap:wrap; justify-content:center; gap:8px; align-items:center;}
.examples span{font-size:12px; color:var(--ink-faint);}
.ex-chip{border:1px solid var(--border); background:rgba(255,255,255,0.02); padding:7px 13px; border-radius:999px; font-size:12px; color:var(--ink-muted); transition:.15s;}
.ex-chip:hover{border-color:rgba(255,255,255,0.18); color:var(--ink);}

.pipeline-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:18px;}
.pipeline-head h2{font-size:15px; font-weight:600;}
.pipeline{position:relative; margin-top:24px;}
.pl-track{position:absolute; left:19px; top:24px; bottom:24px; width:1px; background:rgba(255,255,255,0.07);}
.pl-fill{position:absolute; left:19px; top:24px; width:1px; background:linear-gradient(180deg,var(--signal),var(--sarthi),var(--verdant)); height:0; transition:height .6s ease;}
.pl-step{display:flex; gap:16px; margin-bottom:12px; opacity:.4; transition:opacity .3s;}
.pl-step.active,.pl-step.done{opacity:1;}
.pl-node{position:relative; z-index:1; width:40px; height:40px; border-radius:999px; display:flex; align-items:center; justify-content:center; border:1px solid var(--border); background:var(--void-panel); color:var(--ink-faint); flex-shrink:0;}
.pl-node.running{border-color:rgba(47,111,255,0.5); background:rgba(47,111,255,0.12); color:var(--signal-glow);}
.pl-node.done{border-color:rgba(45,212,167,0.4); background:rgba(45,212,167,0.12); color:var(--verdant);}
.pl-card{flex:1; padding:16px; margin-bottom:2px;}
.pl-card.running{border-color:rgba(47,111,255,0.3); box-shadow:0 0 40px -8px rgba(47,111,255,0.45);}
.pl-card-top{display:flex; flex-wrap:wrap; justify-content:space-between; gap:8px; align-items:center;}
.pl-agent-name{font-size:14px; font-weight:600;}
.pl-status-done{font-size:11px; font-weight:500; color:var(--verdant); display:inline-flex; align-items:center; gap:4px;}
.pl-status-running{font-size:11px; font-weight:500; color:var(--signal-glow);}
.pl-status-pending{font-size:11px; color:var(--ink-faint);}
.pl-dur{font-size:11px; color:var(--ink-faint);}
.pl-output{margin-top:12px; border:1px solid var(--border); background:rgba(0,0,0,0.2); border-radius:12px; padding:12px; display:none;}
.pl-output.show{display:block; animation:fadeIn .35s ease both;}
.pl-output-title{font-size:13px; font-weight:500;}
.pl-output-preview{font-size:12.5px; color:var(--ink-muted); margin-top:4px; line-height:1.5;}
.spin{animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

.report-ready{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:16px; padding:20px; margin-top:24px; display:none;}
.report-ready.show{display:flex; animation:fadeIn .4s ease both;}
.rr-left{display:flex; align-items:center; gap:12px;}
.rr-icon{background:rgba(45,212,167,0.1); padding:10px; border-radius:12px; color:var(--verdant); display:flex;}
.rr-title{font-size:14px; font-weight:500;}
.rr-sub{font-size:12.5px; color:var(--ink-muted);}
.btn-open{display:flex; align-items:center; gap:8px; background:rgba(255,255,255,0.06); padding:11px 18px; border-radius:10px; font-size:13px; font-weight:500; transition:.15s;}
.btn-open:hover{background:rgba(255,255,255,0.1);}

/* ---------- REPORT PAGE ---------- */
.report-wrap{max-width:1200px; margin:0 auto; padding:48px 40px;}
.report-head{display:flex; flex-wrap:wrap; justify-content:space-between; gap:16px; align-items:flex-start; margin-bottom:32px;}
.report-eyebrow{font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:var(--ink-faint); margin-bottom:8px;}
.report-title{font-size:28px; font-weight:600; letter-spacing:-0.01em;}
.report-metrics{display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:24px;}
@media(max-width:900px){.report-metrics{grid-template-columns:repeat(2,1fr);}}
.rm-card{padding:16px;}
.rm-value{font-size:20px; font-weight:600; margin-top:12px;}
.rm-label{font-size:12px; color:var(--ink-muted); margin-top:2px;}
.report-grid{display:grid; grid-template-columns:2fr 1fr; gap:24px;}
@media(max-width:900px){.report-grid{grid-template-columns:1fr;}}
.exec-summary{padding:24px;}
.exec-summary h2{font-size:16px; font-weight:600; margin-bottom:12px;}
.exec-summary p{font-size:14.5px; line-height:1.7; color:var(--ink-muted);}
.conf-panel{padding:24px; display:flex; flex-direction:column; align-items:center; text-align:center;}
.conf-ring-wrap{position:relative; width:128px; height:128px;}
.conf-ring-label{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;}
.conf-ring-value{font-size:24px; font-weight:600;}
.conf-ring-cap{font-size:10px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-faint);}
.cred-row{width:100%; margin-top:20px; text-align:left;}
.cred-top{display:flex; justify-content:space-between; font-size:12.5px; margin-bottom:6px;}
.cred-track{height:6px; border-radius:99px; background:rgba(255,255,255,0.06); overflow:hidden;}
.cred-fill{height:100%; width:92%; background:linear-gradient(90deg,var(--signal),var(--verdant));}

.insight-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-top:24px;}
@media(max-width:900px){.insight-grid{grid-template-columns:1fr;}}
.insight-card{border:1px solid; border-radius:18px; padding:20px;}
.insight-card h3{font-size:14px; font-weight:600; color:var(--ink);}
.insight-top{display:flex; align-items:center; gap:8px; margin-bottom:12px;}
.insight-card li{font-size:13px; line-height:1.6; color:var(--ink-muted); list-style:none; margin-bottom:10px; padding-left:16px; position:relative;}
.insight-card li:before{content:"—"; position:absolute; left:0; color:var(--ink-faint);}

.rec-box{padding:24px; margin-top:24px;}
.rec-head{display:flex; align-items:center; gap:8px; margin-bottom:18px;}
.rec-head h2{font-size:16px; font-weight:600;}
.rec-item{display:flex; gap:14px; border:1px solid var(--border); background:rgba(0,0,0,0.2); border-radius:14px; padding:16px; margin-bottom:12px;}
.rec-rank{flex-shrink:0; width:28px; height:28px; border-radius:999px; border:1px solid rgba(124,92,255,0.3); background:rgba(124,92,255,0.1); color:var(--sarthi-glow); display:flex; align-items:center; justify-content:center; font-size:12px; margin-top:2px;}
.rec-item-top{display:flex; flex-wrap:wrap; justify-content:space-between; gap:8px;}
.rec-item-title{font-size:14px; font-weight:500;}
.rec-item-conf{font-size:11px; color:var(--ink-faint);}
.rec-item p{font-size:13px; color:var(--ink-muted); margin-top:4px; line-height:1.5;}

.timeline-box{padding:24px; margin-top:24px;}
.timeline-box h2{font-size:16px; font-weight:600; margin-bottom:18px;}
.tl{position:relative; border-left:1px solid var(--border); padding-left:24px;}
.tl-item{position:relative; margin-bottom:22px;}
.tl-item:last-child{margin-bottom:0;}
.tl-dot{position:absolute; left:-29px; top:4px; width:10px; height:10px; border-radius:999px; border:2px solid var(--void); background:linear-gradient(135deg,var(--signal),var(--verdant));}
.tl-top{display:flex; flex-wrap:wrap; gap:8px; align-items:center; font-size:13.5px;}
.tl-top .idx{font-size:11px; color:var(--ink-faint);}
.tl-top .dur{font-size:11px; color:var(--ink-faint);}
.tl-item p{font-size:13px; color:var(--ink-muted); margin-top:4px; line-height:1.5;}

/* ---------- AGENTS PAGE ---------- */
.agents-wrap{max-width:1200px; margin:0 auto; padding:48px 40px;}
.agents-wrap > .page-head p{max-width:560px;}
.page-head{margin-bottom:32px;}
.page-head h1{font-size:28px; font-weight:600; letter-spacing:-0.01em; margin-top:4px;}
.page-head p{margin-top:8px; font-size:14.5px; color:var(--ink-muted);}

.flow-panel{padding:24px; margin-bottom:32px; overflow-x:auto;}
.flow-row{display:flex; align-items:center; justify-content:space-between; min-width:720px;}
.flow-item{display:flex; align-items:center; flex:1;}
.flow-node{display:flex; flex-direction:column; align-items:center; gap:10px;}
.flow-circle{position:relative; width:48px; height:48px; border-radius:999px; border:1px solid rgba(47,111,255,0.3); background:rgba(47,111,255,0.08); color:var(--signal-glow); display:flex; align-items:center; justify-content:center;}
.flow-circle .ping{position:absolute; top:-1px; right:-1px; width:10px; height:10px; border-radius:999px; background:var(--verdant); box-shadow:0 0 0 2px var(--void);}
.flow-label{font-size:10.5px; color:var(--ink-muted); text-align:center;}
.flow-line{position:relative; height:1px; flex:1; margin:0 8px; background:rgba(255,255,255,0.08); overflow:hidden;}
.flow-pulse{position:absolute; inset:0 auto 0 -10%; width:32px; background:linear-gradient(90deg,transparent,var(--sarthi-glow),transparent); animation:flowmove 2.2s linear infinite;}
@keyframes flowmove{from{left:-10%;} to{left:110%;}}

.agent-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:16px;}
@media(max-width:900px){.agent-grid{grid-template-columns:repeat(2,1fr);}}
@media(max-width:600px){.agent-grid{grid-template-columns:1fr;}}
.agent-card{padding:20px;}
.ac-top{display:flex; justify-content:space-between; align-items:flex-start;}
.ac-icon{background:rgba(255,255,255,0.04); padding:10px; border-radius:12px; color:var(--signal-glow); display:flex;}
.ac-active{display:flex; align-items:center; gap:6px; border:1px solid rgba(45,212,167,0.25); background:rgba(45,212,167,0.07); padding:3px 9px; border-radius:999px; font-size:10.5px; font-weight:500; color:var(--verdant);}
.ac-name{font-size:15px; font-weight:600; margin-top:16px;}
.ac-role{font-size:12.5px; color:var(--ink-faint); margin-top:2px;}
.ac-desc{font-size:13px; color:var(--ink-muted); margin-top:12px; line-height:1.5;}
.ac-stats{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; border-top:1px solid var(--border); padding-top:14px; margin-top:16px;}
.ac-stats .v{font-size:13px;}
.ac-stats .l{font-size:10.5px; color:var(--ink-faint);}

/* ---------- KNOWLEDGE PAGE ---------- */
.kb-wrap{max-width:1200px; margin:0 auto; padding:48px 40px;}
.kb-head{display:flex; flex-wrap:wrap; justify-content:space-between; align-items:flex-end; gap:16px; margin-bottom:32px;}
.kb-metrics{display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:24px;}
@media(max-width:900px){.kb-metrics{grid-template-columns:repeat(2,1fr);}}
.kb-metric{padding:16px;}
.kb-metric .v{font-size:20px; font-weight:600; margin-top:12px;}
.kb-metric .l{font-size:12px; color:var(--ink-muted); margin-top:2px;}
.dropzone{padding:40px; text-align:center; margin-bottom:24px; border-style:dashed !important;}
.dz-icon{display:inline-flex; background:rgba(124,92,255,0.08); color:var(--sarthi-glow); padding:12px; border-radius:999px; margin-bottom:12px;}
.dz-title{font-size:14px; font-weight:500;}
.dz-sub{font-size:12.5px; color:var(--ink-faint); margin-top:4px;}
.kb-table-panel{padding:20px;}
.kb-table-top{display:flex; flex-wrap:wrap; justify-content:space-between; gap:12px; align-items:center; margin-bottom:16px;}
.kb-table-top h2{font-size:15px; font-weight:600;}
.kb-search{display:flex; align-items:center; gap:8px; border:1px solid var(--border); background:rgba(255,255,255,0.02); padding:9px 12px; border-radius:10px;}
.kb-search input{background:transparent; border:none; font-size:13px; color:var(--ink); font-family:inherit;}
.kb-search input:focus{outline:none;}
.kb-search input::placeholder{color:var(--ink-faint);}
table{width:100%; border-collapse:collapse; min-width:640px;}
thead th{text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-faint); font-weight:500; padding-bottom:10px; border-bottom:1px solid var(--border);}
tbody td{padding:14px 0; font-size:13px; border-bottom:1px solid rgba(255,255,255,0.04);}
tbody tr:last-child td{border-bottom:none;}
.file-cell{display:flex; align-items:center; gap:10px;}
.status-indexed,.status-processing{display:inline-flex; align-items:center; gap:6px; padding:2px 9px; border-radius:999px; font-size:10.5px; font-weight:500;}
.status-indexed{border:1px solid rgba(45,212,167,0.25); background:rgba(45,212,167,0.07); color:var(--verdant);}
.status-processing{border:1px solid rgba(255,176,32,0.25); background:rgba(255,176,32,0.07); color:var(--amber);}
.status-indexed .dot,.status-processing .dot{width:6px;height:6px;}

/* ---------- AUTH MODAL ---------- */
.modal-overlay{
  position:fixed; inset:0; z-index:100; background:rgba(4,6,11,0.85); backdrop-filter:blur(16px);
  display:flex; align-items:center; justify-content:center; padding:20px; opacity:0; pointer-events:none; transition:.25s ease;
}

async function checkBackendHealth() {
  const chip = document.getElementById('systemStatusChip');
  try {
    const res = await fetch(`${API_BASE_URL}/health`);
    if (res.ok) {
      chip.innerHTML = `<span class="dot"></span>Backend Connected`;
      chip.style.color = `var(--verdant)`;
    } else {
      chip.innerHTML = `<span class="dot" style="color:var(--amber)"></span>Standby Mode`;
    }
  } catch (err) {
    chip.innerHTML = `<span class="dot" style="color:var(--sarthi-glow)"></span>Standby Mode`;
  }
}

async function fetchBackendHistory() {
  if (!authToken) return;
  try {
    const res = await fetch(`${API_BASE_URL}/workflow/reports`, {
      headers: { 'Authorization': `Bearer ${authToken}` }
    });
    const json = await res.json();
    if (json.success && Array.isArray(json.data)) {
      userReportsHistory = json.data;
      if (view === 'dashboard') {
        const wrap = document.getElementById('recentRunsWrap');
        if (wrap && userReportsHistory.length > 0) {
          wrap.innerHTML = userReportsHistory.slice(0, 4).map(r => `
            <button class="run-row" onclick="loadAndShowReport('${r._id}')">
              <div style="min-width:0;">
                <div class="run-q">${r.query}</div>
                <div class="run-t mono">${new Date(r.createdAt).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</div>
              </div>
              <div style="display:flex;align-items:center;gap:8px;flex-shrink:0;">
                <div class="bar-track"><div class="bar-fill" style="width:85%"></div></div>
                <span class="mono" style="font-size:11px;color:var(--ink-muted)">85%</span>
              </div>
            </button>
          `).join('');
        }
      }
    }
  } catch (err) {
    console.warn("Could not fetch backend history:", err);
  }
}

async function loadAndShowReport(id) {
  const found = userReportsHistory.find(r => r._id === id);
  if (found) {
    currentReportData = parseReportPayload(found);
    setView('report');
  }
}

function parseReportPayload(raw) {
  const query = raw.query || currentQuery || "Strategic Analysis Report";
  const analysis = raw.analysis || "Synthesized analytical themes from multi-agent data streams.";
  const reportText = raw.report || "";

  let recsList = [];
  if (typeof raw.recommendations === 'string' && raw.recommendations.trim()) {
    recsList = raw.recommendations.split(/\n(?=\d+\.|\*|-)/).filter(r => r.trim()).map((r, i) => {
      const clean = r.replace(/^(\d+\.|\*|-)\s*/, "").trim();
      const parts = clean.split(/:\s*/);
      return {
        rank: i + 1,
        title: parts.length > 1 ? parts[0] : `Strategic Move ${i + 1}`,
        detail: parts.length > 1 ? parts.slice(1).join(": ") : parts[0],
        c: Math.max(70, 92 - i * 6)
      };
    });
  }

  if (recsList.length === 0) {
    recsList = [
      { rank: 1, title: 'Localize battery sourcing', detail: 'Pursue a joint venture for in-country cell assembly to qualify for subsidy tiers and cut landed cost by ~15%.', c: 88 },
      { rank: 2, title: 'Launch a fleet-first pilot', detail: 'Target commercial fleets in Tier-1 cities where charging density already supports daily-duty cycles.', c: 81 },
      { rank: 3, title: 'Reprice against BYD Atto tier', detail: 'Introduce a mid-trim SKU within 12% of BYD pricing to defend mid-market share.', c: 74 }
    ];
  }

  let sourcesList = [];
  if (Array.isArray(raw.sources)) {
    sourcesList = raw.sources.map(s => typeof s === 'string' ? { title: s, url: '#' } : s);
  } else {
    sourcesList = [
      { title: "Sarthi AI Knowledge Base", url: "#" },
      { title: "Tavily Live Web Index", url: "#" }
    ];
  }

  return {
    query,
    analysis,
    reportText,
    recommendations: recsList,
    sources: sourcesList,
    confidence: 85,
    createdAt: raw.createdAt ? new Date(raw.createdAt).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) : '4 min ago'

function initNetworkCanvas(){
  const canvas = document.getElementById('netCanvas');
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  const labels = ['Planner','Search','Retrieval','Analysis','Recommend','Report'];
  let width, height, nodes, raf;
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function resize(){
    const parent = canvas.parentElement;
    width = parent.clientWidth; height = parent.clientHeight;
    canvas.width = width*devicePixelRatio; canvas.height = height*devicePixelRatio;
    canvas.style.width = width+'px'; canvas.style.height = height+'px';
    ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
    const count = Math.max(18, Math.min(34, Math.floor((width*height)/42000)));
    nodes = Array.from({length:count}).map((_,i)=>{
      const isCore = i < labels.length;
      return {x:Math.random()*width, y:Math.random()*height, vx:(Math.random()-.5)*.18, vy:(Math.random()-.5)*.18, r:isCore?3.2:1.6+Math.random()*1.2, label:isCore?labels[i]:null, isCore};
    });
  }
  function step(){
    ctx.clearRect(0,0,width,height);
    for(const n of nodes){
      if(!reduced){ n.x+=n.vx; n.y+=n.vy; if(n.x<0||n.x>width) n.vx*=-1; if(n.y<0||n.y>height) n.vy*=-1; }
    }
    for(let i=0;i<nodes.length;i++){
      for(let j=i+1;j<nodes.length;j++){
        const a=nodes[i], b=nodes[j];
        const dx=a.x-b.x, dy=a.y-b.y, dist=Math.sqrt(dx*dx+dy*dy), maxDist=160;
        if(dist<maxDist){
          const alpha=(1-dist/maxDist)*((a.isCore||b.isCore)?0.35:0.12);
          ctx.strokeStyle=`rgba(124,140,255,${alpha})`; ctx.lineWidth=1;
          ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
        }
      }
    }
    for(const n of nodes){
      ctx.beginPath(); ctx.fillStyle = n.isCore?'rgba(124,92,255,0.9)':'rgba(94,116,209,0.55)';
      ctx.arc(n.x,n.y,n.r,0,Math.PI*2); ctx.fill();
      if(n.isCore){
        ctx.beginPath(); ctx.fillStyle='rgba(124,92,255,0.15)'; ctx.arc(n.x,n.y,n.r*4,0,Math.PI*2); ctx.fill();
        ctx.font='11px JetBrains Mono, monospace'; ctx.fillStyle='rgba(169,180,232,0.55)';
        ctx.fillText(n.label, n.x+8, n.y-8);
      }
    }
    raf = requestAnimationFrame(step);
  }
  resize(); step();
  window.addEventListener('resize', resize);
}

async function runQuery(q){
  if(!q || !q.trim()) return;
  currentQuery = q.trim();
  const input = document.getElementById('queryInput');
  if(input) input.value = currentQuery;
  pipelineRunning = true; pipelineDone = false; pipelineIndex = 0;
  const exWrap = document.getElementById('examplesWrap');
  if (exWrap) exWrap.innerHTML = '';
  renderPipeline();

  // Animate progress steps while requesting backend
  clearInterval(pipelineTimer);
  pipelineTimer = setInterval(()=>{
    if (pipelineIndex < PIPELINE_STEPS.length - 1) {
      pipelineIndex++;
      renderPipeline();
    }
  }, 1100);

  // Trigger backend execution
  try {
    let rawData = null;
    const headers = { 'Content-Type': 'application/json' };
    if (authToken) headers['Authorization'] = `Bearer ${authToken}`;

    const res = await fetch(`${API_BASE_URL}/workflow/run`, {
      method: 'POST',
      headers,
      body: JSON.stringify({ query: currentQuery })
    });

    if (res.ok) {
      const json = await res.json();
      rawData = json.data || json;
    } else {
      // Direct Python Agent endpoint fallback
      const pyRes = await fetch(AGENT_MICROSERVICE_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query: currentQuery })
      });
      if (pyRes.ok) rawData = await pyRes.json();
    }

    if (rawData) {
      currentReportData = parseReportPayload(rawData);
    }
  } catch (err) {
    console.warn("Backend request failed, generating fallback report:", err);
  } finally {
    clearInterval(pipelineTimer);
    pipelineIndex = PIPELINE_STEPS.length;
    pipelineRunning = false;
    pipelineDone = true;
    renderPipeline();
  }
}

  const wrap = document.getElementById('pipelineWrap');

  const pct = (Math.min(pipelineIndex, PIPELINE_STEPS.length-1) / (PIPELINE_STEPS.length-1))*100;

  document.getElementById('authSubtitle').innerText = isAuthModeLogin ? 'Access your autonomous multi-agent workspace' : 'Get started with Sarthi decision intelligence';
  document.getElementById('nameGroup').style.display = isAuthModeLogin ? 'none' : 'flex';
  document.getElementById('authSubmitBtn').innerText = isAuthModeLogin ? 'Sign In' : 'Register';
  document.getElementById('authToggleText').innerText = isAuthModeLogin ? "Don't have an account?" : "Already have an account?";
  document.getElementById('authToggleBtn').innerText = isAuthModeLogin ? 'Sign Up' : 'Sign In';
  document.getElementById('authError').style.display = 'none';
}

document.getElementById('authForm')?.addEventListener('submit', async (e) => {
  e.preventDefault();
  const errDiv = document.getElementById('authError');
  errDiv.style.display = 'none';

  const email = document.getElementById('authEmail').value;
  const password = document.getElementById('authPassword').value;
  const name = document.getElementById('authName')?.value;

  const endpoint = isAuthModeLogin ? `${API_BASE_URL}/auth/login` : `${API_BASE_URL}/auth/register`;
  const body = isAuthModeLogin ? { email, password } : { name, email, password };

  try {
    const res = await fetch(endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    const json = await res.json();

    if (res.ok && json.success) {
      currentUser = json.data.user;
      authToken = json.data.token;
      localStorage.setItem('sarthi_user', JSON.stringify(currentUser));
      localStorage.setItem('sarthi_token', authToken);
      closeAuthModal();
      renderNav();
      fetchBackendHistory();
    } else {
      errDiv.innerText = json.message || "Authentication failed.";
      errDiv.style.display = 'block';
    }
  } catch (err) {
    errDiv.innerText = "Could not connect to authentication service.";
    errDiv.style.display = 'block';
  }
});

function handleLogout() {
  currentUser = null;
  authToken = null;
  localStorage.removeItem('sarthi_user');
  localStorage.removeItem('sarthi_token');
  renderNav();
  if (view === 'dashboard') renderView();
}

/* ============ INIT ============ */
checkBackendHealth();
renderNav();
renderView();
</script>
</body>
</html>
